<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soyeldafadar.in/view - Member Data Management</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: #007BFF; color: white; }
        img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .btn-export { margin-top: 20px; background: #28a745; display: inline-block; text-align: center; text-decoration: none; color: white; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; border: none; width: 100%; font-size: 16px; }
        .btn-export:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>DATA VIEW & MANAGEMENT</h2>

        <!-- Data View Table -->
        <table>
            <thead>
                <tr>
                    <th>NAME</th>
                    <th>MOBILE</th>
                    <th>PHOTO</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="3">Koi data nahi hai</td></tr>
            </tbody>
        </table>

        <!-- Export in Excel Button -->
        <button class="btn-export" onclick="exportToExcel()">EXPORT IN EXCEL 📊</button>
    </div>

    <script>
        // Page load hone par data load karna
        window.onload = function() {
            loadTableData();
        };

        function loadTableData() {
            const members = JSON.parse(localStorage.getItem("soyelMembers")) || [];
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (members.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3">Koi data nahi hai</td></tr>`;
                return;
            }

            members.forEach(m => {
                const row = `<tr>
                    <td>${m.name}</td>
                    <td>${m.mob}</td>
                    <td><img src="${m.photo}" alt="Photo"></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function exportToExcel() {
            const members = JSON.parse(localStorage.getItem("soyelMembers")) || [];
            if (members.length === 0) {
                alert("Export karne ke liye koi data nahi hai!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,NAME,MOBILE,PHOTO\n";
            members.forEach(m => {
                csvContent += `"${m.name}","${m.mob}","${m.photo}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "soyeldafadar_members.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
